name: Publish bindings (PyPI and npm)

# Manual only. The default run builds the artefacts and publishes nothing.
# Publishing needs the maintainer's approval (see docs/bindings.md):
#   1. Run with publish = false and check the artefacts.
#   2. Run again with publish = true. PyPI uses trusted publishing; npm uses the
#      NPM_TOKEN secret. Nothing else in the repository triggers this workflow.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI and npm (false = build artefacts only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-python:
    name: build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: crates/tpt-algo-py
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip maturin
      - run: maturin build --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: crates/tpt-algo-py/dist/*.whl

  build-npm:
    name: build npm package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crates/tpt-algo-wasm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: wasm-pack build --release --target bundler
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: crates/tpt-algo-wasm/pkg

  publish-pypi:
    name: publish to PyPI
    needs: build-python
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    name: publish to npm
    needs: build-npm
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: pkg
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm publish ./pkg --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
