[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "tpt-algo"
version = "0.0.0"
description = "Python bindings for tpt-algo-fraud (Isolation Forest) and tpt-algo-soc (battery state-of-charge EKF)."
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
readme = "README.md"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[tool.maturin]
module-name = "tpt_algo"
features = ["extension-module"]
