[package]
name = "tpt-algo-swarm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Velocity-obstacle collision avoidance and grid path planning for multi-agent systems"
readme = "README.md"
keywords = ["collision-avoidance", "velocity-obstacle", "multi-agent", "path-planning", "no-std"]
categories = ["algorithms", "science::robotics", "simulation", "no-std"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []
serde = ["dep:serde"]

[dependencies]
libm.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
tpt-algo-synth-data.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
