[package]
name = "tpt-algo-wasm"
description = "WebAssembly bindings for the tpt-algo crates: Isolation Forest, battery EKF, routing, order book, swarm avoidance and a consensus simulator."
repository = "https://github.com/tpt-solutions/tpt-algorithms"
readme = "README.md"
keywords = ["wasm", "webassembly", "wasm-bindgen", "npm"]
categories = ["wasm", "api-bindings"]
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
tpt-algo-bindings-core = { path = "../../internal/tpt-algo-bindings-core" }

[dev-dependencies]
wasm-bindgen-test = "0.3"
serde_json = "1"

# Built on its own with wasm-pack (see docs/bindings.md). Excluded from the root
# workspace so the native workspace build never targets wasm32.
[workspace]
