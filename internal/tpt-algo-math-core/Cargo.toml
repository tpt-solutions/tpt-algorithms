[package]
name = "tpt-algo-math-core"
description = "Internal shared numerics: stats, tolerances, fixed-point, deterministic RNG."
readme = "README.md"
keywords = ["numerics", "fixed-point", "statistics", "rng"]
categories = ["algorithms", "mathematics"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["std"]
std = ["alloc"]
alloc = []
serde = ["dep:serde"]
# Shared proptest strategies (test-only; needs std).
proptest = ["std", "dep:proptest"]

[dependencies]
libm.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true
proptest = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
proptest.workspace = true
