[package]
name = "tpt-algo-geometry"
description = "Internal shared 2D/3D geometry and kinematics helpers."
readme = "README.md"
keywords = ["geometry", "kinematics", "vectors"]
categories = ["mathematics", "science::robotics"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["std"]
std = ["alloc"]
alloc = []
serde = ["dep:serde"]

[dependencies]
libm.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
proptest.workspace = true
